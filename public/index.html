<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoReg 注册控制台</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#26303d;--txt:#c9d1d9;--dim:#8b949e;--acc:#3fb950;--warn:#d29922;--err:#f85149;--blue:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:600}
header .sub{color:var(--dim);font-size:12px}
#pill{margin-left:auto;padding:4px 12px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.wrap{display:grid;grid-template-columns:380px 1fr;gap:16px;padding:16px;min-height:calc(100vh - 57px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;overflow:auto}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
input,select{width:100%;padding:8px 10px;background:#0d1117;border:1px solid var(--line);border-radius:6px;color:var(--txt);font:inherit}
select:focus{outline:none;border-color:var(--blue)}
input:focus{outline:none;border-color:var(--blue)}
details{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
summary{cursor:pointer;font-size:12px;color:var(--dim)}
.row{display:flex;gap:8px}.row>*{flex:1}
button{padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:#21262d;color:var(--txt);cursor:pointer;font:inherit}
button:hover{border-color:var(--blue)}
button.primary{background:#238636;border-color:#2ea043;color:#fff;width:100%;margin-top:18px;font-weight:600}
button.primary:disabled{opacity:.45;cursor:not-allowed}
button.ghost{width:100%;margin-top:8px}
.hint{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5}
.hint b{color:var(--warn)}
.right{display:grid;grid-template-rows:1fr 220px;gap:16px;min-height:0}
#shotbox{display:flex;flex-direction:column;min-height:0}
#shot{width:100%;height:100%;object-fit:contain;background:#000;border-radius:8px;display:none}
#shotph{color:var(--dim);font-size:12px;margin:auto;text-align:center}
#log{font:12px/1.6 Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:#adbac7}
#log .t{color:var(--dim)}
#log .e{color:var(--err)}
#log .k{color:var(--acc)}
.s-idle{border-color:var(--line)!important}
.s-run{border-color:var(--blue)!important;color:var(--blue)!important}
.s-done{border-color:var(--acc)!important;color:var(--acc)!important}
.s-error{border-color:var(--err)!important;color:var(--err)!important}
#banner{display:none;align-items:flex-start;gap:10px;margin:0 16px 0;padding:10px 14px;border:1px solid var(--warn);border-radius:8px;background:#2d2213;color:#f0d18a;font-size:13px}
#banner.on{display:flex}
#banner b{color:#ffd479}
#banner button{margin-left:auto;padding:2px 10px;background:transparent;border:1px solid var(--warn);color:#f0d18a;border-radius:6px;font-size:12px;cursor:pointer}
#dry{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--dim)}
#dry input{width:auto}
</style>
</head>
<body>
<header>
  <h1>AutoReg 注册控制台</h1>
  <span class="sub">本地半自动：脚本填表，人机验证由你在弹出的浏览器里完成</span>
  <span id="pill" class="s-idle">待命</span>
</header>
<div id="banner"><span id="bannerText"></span><button id="bannerClose">知道了</button></div>
<div class="wrap">
  <section class="card">
    <label>站点配置</label>
    <select id="site"></select>
    <label>目标注册页</label>
    <input id="url" placeholder="https://..." value="https://chuan.sylu.cc/sign-up?aff=UpsG" />
    <label>用户名 / 邮箱</label>
    <input id="username" placeholder="注册时填写" autocomplete="off" />
    <label>密码（8-20 位）</label>
    <input id="password" type="password" placeholder="注册时填写" autocomplete="new-password" />
    <label>确认密码</label>
    <input id="confirm" type="password" placeholder="留空则同密码" autocomplete="new-password" />
    <details>
      <summary>邮箱收信（SMTP / IMAP，可留空）</summary>
      <div class="row"><div><label>IMAP 主机</label><input id="mhost" placeholder="imap.qq.com" /></div><div><label>端口</label><input id="mport" placeholder="993" /></div></div>
      <label>邮箱账号</label><input id="muser" placeholder="留空" autocomplete="off" />
      <label>邮箱密码 / 授权码</label><input id="mpass" type="password" placeholder="留空" autocomplete="off" />
    </details>
    <label id="dry"><input type="checkbox" id="dryRun" /> 演练模式（填表 + 等验证，不点提交、不创建账号）</label>
    <button id="go" class="primary">开始注册</button>
    <button id="shut" class="ghost">关闭自动化浏览器</button>
    <div class="hint">该站 <b>有 Cloudflare Turnstile</b>，注册页没有邮箱字段。脚本会填好表后等你通过验证，再点提交。</div>
  </section>
  <div class="right">
    <section class="card" id="shotbox">
      <img id="shot" alt="浏览器截图" />
      <div id="shotph">浏览器窗口截图会显示在这里</div>
    </section>
    <section class="card"><div id="log"></div></section>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const logEl = $('log');
function addLog(text, cls){
  const d = document.createElement('div');
  const t = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  d.innerHTML = '<span class="t">[' + t + ']</span> ' + '<span class="' + (cls||'') + '"></span>';
  d.lastChild.textContent = text;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
}
function setPill(st, text){
  const p = $('pill'); p.textContent = text || st;
  p.className = st === 'done' ? 's-done' : (st === 'error' ? 's-error' : (st === 'idle' ? 's-idle' : 's-run'));
}
function showBanner(text){
  $('bannerText').textContent = text;
  $('banner').classList.add('on');
  addLog('需要你操作: ' + text, 'e');
}
$('bannerClose').onclick = () => $('banner').classList.remove('on');

const saved = JSON.parse(localStorage.getItem('autoreg') || '{}');
['url','username','mhost','mport','muser'].forEach(k => { if (saved[k]) $(k).value = saved[k]; });
function persist(){
  const o = {};
  ['url','username','mhost','mport','muser'].forEach(k => o[k] = $(k).value);
  localStorage.setItem('autoreg', JSON.stringify(o));
}
['url','username','mhost','mport','muser'].forEach(k => $(k).addEventListener('change', persist));

const siteMap = {};
fetch('/api/sites').then(r => r.json()).then(j => {
  const sel = $('site');
  sel.innerHTML = '';
  (j.sites || []).forEach(s => {
    siteMap[s.id] = s;
    const o = document.createElement('option');
    o.value = s.id; o.textContent = s.name;
    sel.appendChild(o);
  });
  const g = document.createElement('option');
  g.value = 'generic'; g.textContent = '通用（按选择器探测，不套站点配置）';
  sel.appendChild(g);
  const savedSite = localStorage.getItem('autoreg_site');
  const urlNow = $('url').value.trim();
  const urlHit = (j.sites || []).find(s => urlNow && s.host && urlNow.includes(s.host));
  if (urlHit) sel.value = urlHit.id;
  else if (savedSite && [...sel.options].some(o => o.value === savedSite)) sel.value = savedSite;
  else if ((j.sites || []).length) sel.value = j.sites[0].id;
  sel.onchange = () => {
    localStorage.setItem('autoreg_site', sel.value);
    const s = siteMap[sel.value];
    if (s && s.signupUrl) { $('url').value = s.signupUrl; persist(); }
  };
  // 地址栏变了就自动认站
  $('url').addEventListener('input', () => {
    const v = $('url').value.trim();
    const hit = (j.sites || []).find(s => v && s.host && v.includes(s.host));
    if (hit) { sel.value = hit.id; localStorage.setItem('autoreg_site', hit.id); }
  });
}).catch(() => {});

$('shot').onload = () => { $('shot').style.display = 'block'; $('shotph').style.display = 'none'; };
$('go').onclick = async () => {
  const body = {
    url: $('url').value.trim(), username: $('username').value.trim(),
    password: $('password').value, confirmPassword: $('confirm').value || $('password').value,
    mail: $('mhost').value ? { host: $('mhost').value.trim(), port: $('mport').value.trim() || 993, user: $('muser').value.trim(), pass: $('mpass').value, secure: true } : null,
    dryRun: $('dryRun').checked,
    site: $('site').value
  };
  $('banner').classList.remove('on');
  if (!body.url || !body.username || !body.password) { alert('地址、用户名/邮箱、密码都要填'); return; }
  $('go').disabled = true;
  logEl.innerHTML = '';
  try {
    const r = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) { addLog(j.message || '提交失败', 'e'); $('go').disabled = false; }
  } catch(e) { addLog('请求失败: ' + e.message, 'e'); $('go').disabled = false; }
};
$('shut').onclick = async () => { await fetch('/api/shutdown', { method:'POST' }); };

const es = new EventSource('/api/events');
es.onmessage = ev => {
  let d; try { d = JSON.parse(ev.data); } catch { return; }
  if (d.type === 'log') addLog(d.text, d.text.startsWith('出错') ? 'e' : '');
  if (d.type === 'status') { setPill(d.state, d.text); addLog('状态: ' + d.text, 'k'); }
  if (d.type === 'shot') { $('shot').src = '/api/shot?v=' + d.v; }
  if (d.type === 'needman') showBanner(d.text || '需要在浏览器里手动完成验证');
  if (d.type === 'result') {
    const msg = d.message || (d.ok ? '成功' : '失败');
    addLog('结果: ' + msg, d.ok ? 'k' : 'e');
    if (!d.ok) showBanner(typeof msg === 'string' ? msg : '注册未完成');
    $('go').disabled = false;
  }
};
es.onerror = () => addLog('事件连接断开，重连中…', 'e');
fetch('/api/state').then(r => r.json()).then(s => {
  setPill(s.state.state, s.state.text);
  (s.logs || []).forEach(l => addLog(l.text));
  if (s.running) $('go').disabled = true;
});
</script>
</body>
</html>
