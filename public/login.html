<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>需要口令</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0f1115; color: #e6e8ee; font: 15px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .box { width: min(360px, 88vw); padding: 28px; border-radius: 16px; background: #171a21; border: 1px solid #262b36; }
  h1 { margin: 0 0 6px; font-size: 18px; }
  p { margin: 0 0 18px; color: #9aa3b2; font-size: 13px; }
  input { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px; border: 1px solid #2d3340; background: #0f1218; color: #e6e8ee; font-size: 15px; }
  button { margin-top: 12px; width: 100%; padding: 11px; border: 0; border-radius: 10px; background: #4f7cff; color: #fff; font-size: 15px; cursor: pointer; }
  .err { margin-top: 10px; color: #ff6b6b; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
  <form class="box" id="f">
    <h1>需要访问口令</h1>
    <p>这个页面被口令保护，输入之后会记住 30 天。</p>
    <input id="t" type="password" placeholder="访问口令" autocomplete="current-password" />
    <button type="submit">进入</button>
    <div class="err" id="e"></div>
  </form>
<script>
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const e = document.getElementById('e');
  e.textContent = '';
  const token = document.getElementById('t').value;
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
  if (r.ok) location.href = '/';
  else e.textContent = '口令不对';
});
</script>
</body>
</html>
